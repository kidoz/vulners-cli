version: "2"

linters:
  default: none
  enable:
    # Essential
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    # Error handling
    - errname
    # Style & modernization
    - revive
    - misspell
    # Security
    - gosec
    # Complexity
    - gocyclo
    - funlen
    # Testing
    - thelper
    - tparallel

  settings:
    gocyclo:
      min-complexity: 15
    funlen:
      lines: 80
      statements: 50
    revive:
      rules:
        - name: package-comments
          disabled: true
        - name: exported
          disabled: true
    gosec:
      excludes:
        - G304 # file inclusion via variable — expected for CLI tool

  exclusions:
    paths:
      - vendor
      - testdata
    rules:
      # G703 (path traversal via taint analysis) is a newer gosec rule not in
      # golangci-lint's config-verify enum, so it cannot live under
      # gosec.excludes. Suppress it here for test fixtures that write files
      # into t.TempDir() paths.
      - path: _test\.go
        linters:
          - gosec
        text: "G703"

formatters:
  enable:
    - goimports
    - gofumpt
  exclusions:
    paths:
      - vendor
      - testdata
